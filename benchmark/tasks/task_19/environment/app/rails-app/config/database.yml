default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: postgres

development:
  <<: *default
  database: production_db

production:
  <<: *default
  database: production_db
  host: localhost
  port: 5432

staging:
  <<: *default
  database: production_db
  host: localhost
  port: 5432
